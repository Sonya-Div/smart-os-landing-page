<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" class="theme-btn"><i class="fa-solid fa-moon"></i></button>
            <a href="https://wikipedia.org/wiki/Logo" class="logo">logo</a>
        </header>
        <nav>
            <ul>
        <li class="mac float">
            <img src="apple.png" alt="Apple logo">
            <a href="https://wikipedia.org/wiki/Apple_Inc." target="_blank">apple</a>
            <div class="like-container">
                <button id="apple-like" class="like-btn"><i class="fa-regular fa-heart"></i></button>
                    <span id="apple-count">0</span>
            </div>
             <div class="ap float">The Mac logo, featuring the iconic Apple symbol, reflects creativity.</div>
        </li>
        <li class="wind">
            <img src="windows.png" alt="Windows logo">
            <a href="https://wikipedia.org/wiki/Windows_(operating_system)" target="_blank">
                windows</a>
            <div class="like-container">
                <button id="windows-like" class="like-btn"><i class="fa-regular fa-heart"></i></button>
                    <span id="windows-count">0</span>
            </div>
            <div class="wi">The Windows logo represents Microsoft's operating system, symbolizing simplicity.</div>
        </li>
        <li class="andr">
            <img src="android.png" alt="Android logo"> 
            <a href="https://wikipedia.org/wiki/Android_(operating_system)" target="_blank">android</a>
            <div class="like-container">
                <button id="android-like" class="like-btn"><i class="fa-regular fa-heart"></i></button>
                    <span id="android-count">0</span>
            </div>
            <div class="an">The Android logo, with its green robot, stands for openness.</div>
        </li>
            </ul>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
